    html, body, #map { width: 100%; height: 100%; padding: 0; margin: 0; }
    .legend-control {

    .layer-item input[type=checkbox] { width:13px; height:13px; accent-color:#2563eb; cursor:pointer; flex-shrink:0; }

    .sym-pt { width:11px; height:11px; border-radius:50%; border:1.5px solid #555; flex-shrink:0; }
    .sym-ln { width:18px; height:3px; border-radius:1px; flex-shrink:0; }
    .sym-pg { width:11px; height:11px; border:1.5px solid #555; flex-shrink:0; }
    .sym-rs { width:11px; height:11px; border-radius:2px; border:1px solid #ccc; flex-shrink:0; }
    .grp-btns { display:flex; gap:3px; }
    .grp-btns button { padding:1px 5px; font-size:8px; font-weight:700; border:none; border-radius:3px; cursor:pointer; color:#fff; }
    .btn-all  { background:#10b981; }
    .btn-none { background:#ef4444; }
    .legend-footer { padding:6px 8px; border-top:1px solid #e5e7eb; display:flex; justify-content:space-between; align-items:center; font-size:9px; color:#6b7280; background:#f9fafb; border-radius:0 0 8px 8px; }
    .legend-footer button { padding:3px 9px; font-size:9px; font-weight:600; border:none; border-radius:3px; cursor:pointer; color:#fff; }
    .btn-show { background:#2563eb; }
    .btn-hide { background:#6b7280; }
    .badge-up { background:#b10a39; color:#fff; font-size:7px; font-weight:700; padding:1px 4px; border-radius:2px; white-space:nowrap; flex-shrink:0; }
    .badge-dn { background:#265eb1; color:#fff; font-size:7px; font-weight:700; padding:1px 4px; border-radius:2px; white-space:nowrap; flex-shrink:0; }
    .pair-row { display:flex; gap:4px; margin:1px 0; }
    .pair-row .layer-item { flex:1; }
    .sub-title { font-size:9px; font-weight:700; color:#374151; padding:3px 0 1px 0; }
    .color-key { display:flex; flex-wrap:wrap; gap:6px; padding:4px; background:#f9fafb; border-radius:4px; margin-top:3px; }
    .color-key-item { display:flex; align-items:center; gap:3px; font-size:9px; color:#374151; }
    .color-key-v { display:flex; flex-direction:column; gap:3px; padding:5px 4px; background:#f9fafb; border-radius:4px; margin-top:3px; }
    .color-key-v-item { display:flex; align-items:center; gap:5px; font-size:9px; color:#374151; }
    .intv-item { padding:3px 0; border-bottom:1px dashed #e5e7eb; }
    .intv-item:last-of-type { border-bottom:none; }
    .basemap-item { display:flex; align-items:center; gap:6px; padding:3px 2px; font-size:10px; border-radius:3px; }
    .basemap-item:hover { background:#f9fafb; }
    .basemap-item input[type=radio] { width:13px; height:13px; accent-color:#2563eb; cursor:pointer; flex-shrink:0; }
    .basemap-item label { flex:1; cursor:pointer; color:#374151; line-height:1.3; }

<script>
// ===== MAP =====
var map = L.map('map', {zoomControl:false, maxZoom:28, minZoom:1})
           .fitBounds([[7.22,80.21],[8.09,81.61]]);
L.control.zoom({position:'topleft'}).addTo(map);
new L.Hash(map);
var measureControl = new L.Control.Measure({
    position:'topleft',
    primaryLengthUnit:'meters', secondaryLengthUnit:'kilometers',
    primaryAreaUnit:'sqmeters', secondaryAreaUnit:'hectares'
});
measureControl.addTo(map);
document.getElementsByClassName('leaflet-control-measure-toggle')[0].innerHTML='';
document.getElementsByClassName('leaflet-control-measure-toggle')[0].className+=' fas fa-ruler';

// ===== HIGHLIGHT =====
function highlightFeature(e) {
    var l=e.target, g=l.feature.geometry.type;
    if(g.includes('Line')) l.setStyle({color:'#ffff00'});
    else l.setStyle({fillColor:'#ffff00',fillOpacity:1});
    l.openPopup();
}
function resetHighlight(e) {
    for(var i in e.target._eventParents)
        if(typeof e.target._eventParents[i].resetStyle==='function')
            e.target._eventParents[i].resetStyle(e.target);
    e.target.closePopup();
}
function onEach(f,l,fields) {
    l.on({mouseover:highlightFeature, mouseout:resetHighlight});
    var h='<table>';
    fields.forEach(function(fd){
        var v=f.properties[fd.k];
        if(v!==null&&v!==undefined&&v!=='') h+='<tr><th>'+fd.n+'</th><td>'+v+'</td></tr>';
    });
    l.bindPopup(h+'</table>',{maxHeight:400});
}

// ===== LAYERS =====
var lyr={};
var basemapKeys=['osm','satellite','satellite_labels','topo','grey'];

// Basemaps
lyr.osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'});
lyr.satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles &copy; Esri'});
lyr.satellite_labels = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Labels &copy; Esri'});
lyr.topo = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',{maxZoom:17,attribution:'Map data &copy; OpenStreetMap | &copy; <a href="https://opentopomap.org">OpenTopoMap</a>'});
lyr.grey = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/">CARTO</a>'});
map.addLayer(lyr.osm);

// Rasters
lyr.loc_dn    = L.imageOverlay('data/location_downstream_1.png',                                                                       [[7.472215662371626,79.83172493181046],[8.440889154806131,81.05907162052064]]);
lyr.loc_up    = L.imageOverlay('data/location_upsteam_2.png',                                                                          [[7.190745519142062,80.55979097218261],[7.879095148236164,81.0644802473354]]);
lyr.stream_a  = L.imageOverlay('data/streamsideprotection_10.png',                                                                     [[7.472215662371626,79.83172465781156],[8.441001965819027,81.05914316178692]]);
lyr.drain_a   = L.imageOverlay('data/Drainagemanagementalongroads_9.png',                                                              [[7.471971760643342,79.83172443102877],[8.440916509299853,81.05907120605528]]);
lyr.tanks_a   = L.imageOverlay('data/Rehabilitationandestablishmentofvillagetankspondsandirrigationnetworks_8.png',                   [[7.472215662371626,79.83172465781156],[8.441001965819027,81.05914316178692]]);
lyr.forest_a  = L.imageOverlay('data/Restorationofforestmosaiclandscapes_7.png',                                                      [[7.472215662371626,79.83172465781156],[8.441001965819027,81.05914316178692]]);
lyr.rice_a    = L.imageOverlay('data/Increasingcroppingintensityofirrigatedriceinbothupstreamanddownstreamareas_6.png',               [[7.472215662371626,79.83172465781156],[8.441001965819027,81.05914316178692]]);
lyr.small6a_a = L.imageOverlay('data/6ASustainableintensificationofsmallholderproduction_5.png',                                      [[7.471971760643342,79.83172443102877],[8.440916509299853,81.05907120605528]]);
lyr.small6b_a = L.imageOverlay('data/6BSustainableintensificationofsmallholderproduction_4.png',                                      [[7.471971760643342,79.83172443102877],[8.440916509299853,81.05907120605528]]);
lyr.plant_a   = L.imageOverlay('data/Restorationandsustainableintensificationofplantations_3.png',                                    [[7.472215662371626,79.83172465781156],[8.441001965819027,81.05914316178692]]);
lyr.stream_b  = L.imageOverlay('data/streamsideprotection_18.png',                                                                    [[7.19074545175455,80.559790947813],[7.879142101696742,81.06458782454193]]);
lyr.drain_b   = L.imageOverlay('data/Drainagemanagementalongroads_17.png',                                                            [[7.190744596474597,80.55970006940598],[7.879365454841279,81.06438967244858]]);
lyr.tanks_b   = L.imageOverlay('data/Rehabilitationandestablishmentofvillagetankspondsandirrigationnetworks_16.png',                  [[7.19074545175455,80.559790947813],[7.879142101696742,81.06458782454193]]);
lyr.forest_b  = L.imageOverlay('data/Restorationofforestmosaiclandscapes_15.png',                                                     [[7.190745465189268,80.55979096298381],[7.879112871417416,81.06456636685583]]);
lyr.rice_b    = L.imageOverlay('data/Increasingcroppingintensityofirrigatedriceinbothupstreamanddownstreamareas_14.png',              [[7.190745465189268,80.55979096298381],[7.879112871417416,81.06456636685583]]);
lyr.small6a_b = L.imageOverlay('data/6ASustainableintensificationofsmallholderproduction_13.png',                                     [[7.190744596474597,80.55970006940598],[7.879365454841279,81.06438967244858]]);
lyr.small6b_b = L.imageOverlay('data/6BSustainableintensificationofsmallholderproduction_12.png',                                     [[7.190744596474597,80.55970006940598],[7.879365454841279,81.06438967244858]]);
lyr.plant_b   = L.imageOverlay('data/Restorationandsustainableintensificationofplantations_11.png',                                   [[7.190745465189268,80.55979096298381],[7.879112871417416,81.06456636685583]]);

// Boundaries
lyr.updown = L.geoJson(json_UpstreamDownstreamBoundary_19,{
    onEachFeature:function(f,l){onEach(f,l,[{k:'Name',n:'Name'},{k:'Updo',n:'Type'}]);},
    style:function(f){return{color:f.properties.Updo==='Upstream'?'rgba(177,10,57,1)':'rgba(38,94,177,1)',weight:4,fillOpacity:0};}
});
lyr.gnd = L.geoJson(json_GramaNiladhariDivisionBoundary_20,{
    onEachFeature:function(f,l){onEach(f,l,[{k:'GND_N',n:'GND'}]);},
    style:function(){return{color:'rgba(17,2,2,1)',weight:4,fillOpacity:0};}
});
lyr.dsd = L.geoJson(json_DivisionalSecretariatDivisionBoundary_21,{
    onEachFeature:function(f,l){onEach(f,l,[{k:'DSD_N',n:'DSD'}]);},
    style:function(){return{color:'rgba(10,1,1,1)',weight:4,fillOpacity:0};}
});
lyr.dist = L.geoJson(json_DistrictBoundary_22,{
    onEachFeature:function(f,l){onEach(f,l,[{k:'DISTRICT_N',n:'District'}]);},
    style:function(){return{color:'rgba(12,1,2,1)',weight:4,fillOpacity:0};}
});
lyr.prov = L.geoJson(json_ProvienceBoundary_23,{
    onEachFeature:function(f,l){onEach(f,l,[{k:'PROVINCE_N',n:'Province'}]);},
    style:function(){return{color:'rgba(2,5,2,1)',weight:4,fillOpacity:0};}
});
lyr.proj = L.geoJson(json_ProjectBoundary_24,{
    onEachFeature:function(f,l){onEach(f,l,[{k:'SIDT_1',n:'Project'}]);},
    style:function(){return{color:'rgba(228,26,28,1)',weight:4,fillOpacity:0};}
});

// Activities
lyr.a111   = L.geoJson(json_Activity111StreamsideProtectionanddrainagemanagementalongsroads_33,{onEachFeature:function(f,l){onEach(f,l,[{k:'Name',n:'Name'}]);},pointToLayer:function(f,ll){return L.circleMarker(ll,{radius:4,fillColor:'rgba(40,47,183,1)',color:'#333',weight:1,fillOpacity:1});}});
lyr.a112   = L.geoJson(json_Activity112Rehabilitationandestablishmentofvillagetankspondsandirrigationnetworks_32,{onEachFeature:function(f,l){onEach(f,l,[{k:'Name_of_th',n:'Name'}]);},pointToLayer:function(f,ll){return L.circleMarker(ll,{radius:4,fillColor:'rgba(141,220,153,1)',color:'#333',weight:1,fillOpacity:1});}});
lyr.a113pt = L.geoJson(json_Activity113RestorationofforestmosaiclandscapesPoint_31,{onEachFeature:function(f,l){onEach(f,l,[{k:'Name',n:'Name'}]);},pointToLayer:function(f,ll){return L.circleMarker(ll,{radius:4,fillColor:'rgba(16,126,22,1)',color:'#333',weight:1,fillOpacity:1});}});
lyr.a121pt = L.geoJson(json_Activity121IncreasingcroppingintensityofirrigatedricePolyline_30,{onEachFeature:function(f,l){onEach(f,l,[{k:'Name',n:'Name'}]);},pointToLayer:function(f,ll){return L.circleMarker(ll,{radius:4,fillColor:'rgba(232,251,56,1)',color:'#333',weight:1,fillOpacity:1});}});
lyr.a122   = L.geoJson(json_Activity122Intensificationofsustainablesmallholderproduction_29,{onEachFeature:function(f,l){onEach(f,l,[{k:'Name',n:'Name'}]);},pointToLayer:function(f,ll){return L.circleMarker(ll,{radius:4,fillColor:'rgba(239,36,153,1)',color:'#333',weight:1,fillOpacity:1});}});
lyr.a123   = L.geoJson(json_Activity123Restorationandintensificationofsustainableplantations_28,{onEachFeature:function(f,l){onEach(f,l,[{k:'Name',n:'Name'},{k:'Division_N',n:'Division'}]);},pointToLayer:function(f,ll){return L.circleMarker(ll,{radius:4,fillColor:'rgba(213,28,61,1)',color:'#333',weight:1,fillOpacity:1});}});
lyr.a113l  = L.geoJson(json_Activity113RestorationofforestmosaiclandscapesPolyline_27,{onEachFeature:function(f,l){onEach(f,l,[{k:'Name',n:'Name'}]);},style:function(){return{color:'rgba(196,60,57,1)',weight:1,fillOpacity:0};}});
lyr.a113p  = L.geoJson(json_Activity113RestorationofforestmosaiclandscapesPolygon_26,{onEachFeature:function(f,l){onEach(f,l,[{k:'Name',n:'Name'}]);},style:function(){return{color:'rgba(35,35,35,1)',weight:1,fillColor:'rgba(11,255,44,1)',fillOpacity:1};}});
lyr.a121p  = L.geoJson(json_Activity121IncreasingcroppingintensityofirrigatedricePolygon_25,{onEachFeature:function(f,l){onEach(f,l,[{k:'Name',n:'Name'}]);},style:function(){return{color:'rgba(35,35,35,1)',weight:1,fillColor:'rgba(207,204,27,1)',fillOpacity:1};}});

// Overlay keys (no basemaps)
var overlayKeys = Object.keys(lyr).filter(function(k){return basemapKeys.indexOf(k)===-1;});
overlayKeys.forEach(function(k){map.addLayer(lyr[k]);});

// Group definitions
var grpLayers = {
    act:      ['a111','a112','a113pt','a121pt','a122','a123','a113l','a113p','a121p'],
    bnd:      ['updown','gnd','dsd','dist','prov','proj'],
    priority: ['stream_a','stream_b','drain_a','drain_b','tanks_a','tanks_b',
               'forest_a','forest_b','rice_a','rice_b',
               'small6a_a','small6a_b','small6b_a','small6b_b','plant_a','plant_b'],
    loc:      ['loc_dn','loc_up']
};

// ===================================================================
// LEGEND CONTROL
// ROOT CAUSE FIX:
//   disableClickPropagation() intercepts ALL clicks at the container
//   level via useCapture=true, which prevents checkbox/button clicks
//   from ever reaching their targets.
//   Solution: only block mousedown/dblclick/wheel (pan & zoom triggers),
//   and attach all interactive listeners via addEventListener() after
//   innerHTML is set — never rely on inline onchange/onclick.
// ===================================================================
var legendContainer = null;

var LegendControl = L.Control.extend({
    options: {position:'topright'},
    onAdd: function() {
        var c = L.DomUtil.create('div','legend-control');

        // Block only events that would move/zoom the map
        // Do NOT call disableClickPropagation — it kills checkbox/button clicks
        ['mousedown','dblclick','wheel','touchstart'].forEach(function(ev){
            L.DomEvent.on(c, ev, L.DomEvent.stopPropagation);
        });

        c.innerHTML = buildLegendHTML();
        legendContainer = c;
        attachLegendEvents(c);
        return c;
    }
});

function buildLegendHTML() {
    var h = '<div class="legend-header">\uD83D\uDDFA\uFE0F Map Legend</div><div class="legend-content">';

    // Activities group
    h += mkGroup('act','Activities of PMU',[
        {id:'a111',   t:'pt', bg:'rgba(40,47,183,1)',   lbl:'Activity 1.1.1 Streamside Protection and drainage management along roads'},
        {id:'a112',   t:'pt', bg:'rgba(141,220,153,1)', lbl:'Activity 1.1.2 Rehabilitation and establishment of village tanks, ponds and irrigation networks'},
        {id:'a113pt', t:'pt', bg:'rgba(16,126,22,1)',   lbl:'Activity 1.1.3 Restoration of forest mosaic landscapes \u2013 Point'},
        {id:'a121pt', t:'pt', bg:'rgba(232,251,56,1)',  lbl:'Activity 1.2.1 Increasing cropping intensity of irrigated rice \u2013 Polyline'},
        {id:'a122',   t:'pt', bg:'rgba(239,36,153,1)',  lbl:'Activity 1.2.2 Intensification of sustainable smallholder production'},
        {id:'a123',   t:'pt', bg:'rgba(213,28,61,1)',   lbl:'Activity 1.2.3 Restoration and intensification of sustainable plantations'},
        {id:'a113l',  t:'ln', bg:'rgba(196,60,57,1)',   lbl:'Activity 1.1.3 Restoration of forest mosaic landscapes \u2013 Polyline'},
        {id:'a113p',  t:'pg', bg:'rgba(11,255,44,1)',   lbl:'Activity 1.1.3 Restoration of forest mosaic landscapes \u2013 Polygon'},
        {id:'a121p',  t:'pg', bg:'rgba(207,204,27,1)',  lbl:'Activity 1.2.1 Increasing cropping intensity of irrigated rice \u2013 Polygon'}
    ]);

    // Boundaries group
    h += mkGroup('bnd','Boundaries',[

}

function mkGroup(gid, title, items) {
    var h = '<div class="legend-group"><div class="group-header" data-grp-toggle="'+gid+'"><span>\u25BC '+title+'</span>';
    h += '<div class="grp-btns"><button class="btn-all" data-grp-all="'+gid+'">All</button><button class="btn-none" data-grp-none="'+gid+'">None</button></div></div>';
    h += '<div class="group-items" id="g-'+gid+'">';
    items.forEach(function(it){
        h += '<div class="layer-item"><input type="checkbox" id="c_'+it.id+'" data-lyr="'+it.id+'" checked>';
        h += '<div class="sym-'+it.t+'" style="background:'+it.bg+'"></div>';
        h += '<label for="c_'+it.id+'">'+it.lbl+'</label></div>';
    });
    h += '</div></div>';
    return h;
}

// =====================================================================
// Attach ALL interactive events via addEventListener.
// This is the ONLY reliable way to handle events inside Leaflet controls
// when we need to also block map pan/zoom (which requires stopPropagation
// on mousedown, which Leaflet's disableClickPropagation would over-block).
// =====================================================================
function attachLegendEvents(c) {

    // Checkboxes: toggle overlay
    c.querySelectorAll('input[type=checkbox][data-lyr]').forEach(function(el){
        el.addEventListener('change', function(){
            var id = el.getAttribute('data-lyr');
            if(!lyr[id]) return;
            if(el.checked) map.addLayer(lyr[id]);
            else           map.removeLayer(lyr[id]);
            updCnt();
        });
    });

    // Radio: switch basemap
    c.querySelectorAll('input[type=radio][name=basemap]').forEach(function(el){
        el.addEventListener('change', function(){
            if(!el.checked) return;
            switchBasemap(el.value);
        });
    });

    // Group headers: collapse/expand
    c.querySelectorAll('[data-grp-toggle]').forEach(function(el){
        el.addEventListener('click', function(e){
            if(e.target.tagName==='BUTTON') return; // let buttons bubble
            var gid = el.getAttribute('data-grp-toggle');
            var box = document.getElementById('g-'+gid);
            if(box) box.classList.toggle('hidden');
        });
    });

    // All buttons
    c.querySelectorAll('[data-grp-all]').forEach(function(el){
        el.addEventListener('click', function(e){
            e.stopPropagation();
            setGroup(el.getAttribute('data-grp-all'), true);
        });
    });

    // None buttons
    c.querySelectorAll('[data-grp-none]').forEach(function(el){
        el.addEventListener('click', function(e){
            e.stopPropagation();
            setGroup(el.getAttribute('data-grp-none'), false);
        });
    });

    // Show All
    c.querySelector('#btnShowAll').addEventListener('click', function(e){
        e.stopPropagation();
        bulkStart();
        overlayKeys.forEach(function(id){
            var chk = c.querySelector('#c_'+id);
            if(chk) chk.checked = true;
            if(lyr[id] && !map.hasLayer(lyr[id])) map.addLayer(lyr[id]);
        });
        bulkEnd();
        updCnt();
    });

    // Hide All
    c.querySelector('#btnHideAll').addEventListener('click', function(e){
        e.stopPropagation();
        bulkStart();
        overlayKeys.forEach(function(id){
            var chk = c.querySelector('#c_'+id);
            if(chk) chk.checked = false;
            if(lyr[id] && map.hasLayer(lyr[id])) map.removeLayer(lyr[id]);
        });
        bulkEnd();
        updCnt();
    });
}

// ---- bulk layer helpers: suspend label reset during batch ops ----
var _bulkMode = false;
function bulkStart() { _bulkMode = true; }
function bulkEnd()   { _bulkMode = false; scheduleResetLabels(); }

function setGroup(gid, on) {
    var ids = grpLayers[gid];
    if(!ids) return;
    bulkStart();
    ids.forEach(function(id){
        var chk = document.getElementById('c_'+id);
        if(!chk || !lyr[id]) return;
        chk.checked = on;
        if(on) { if(!map.hasLayer(lyr[id])) map.addLayer(lyr[id]); }
        else   { if(map.hasLayer(lyr[id]))  map.removeLayer(lyr[id]); }
    });
    bulkEnd();
    updCnt();
}

function switchBasemap(name) {
    bulkStart();
    basemapKeys.forEach(function(b){ if(map.hasLayer(lyr[b])) map.removeLayer(lyr[b]); });
    if(name==='satellite'){ map.addLayer(lyr.satellite); map.addLayer(lyr.satellite_labels); }
    else if(name==='osm')  map.addLayer(lyr.osm);
    else if(name==='topo') map.addLayer(lyr.topo);
    else if(name==='grey') map.addLayer(lyr.grey);
    bulkEnd();
}

function updCnt() {
    var t=overlayKeys.length, v=0;
    overlayKeys.forEach(function(id){ if(lyr[id]&&map.hasLayer(lyr[id])) v++; });
    var el=document.getElementById('cnt');
    if(el) el.innerText=v+'/'+t+' layers';
}

map.addControl(new LegendControl());
updCnt();

// Debounced label reset — only fires once after all bulk layer changes settle
var _labelTimer = null;
function scheduleResetLabels() {
    if(_labelTimer) clearTimeout(_labelTimer);
    _labelTimer = setTimeout(function(){
        _labelTimer = null;
        resetLabels([lyr.gnd,lyr.dsd,lyr.dist,lyr.prov,lyr.proj]);
    }, 80);
}

resetLabels([lyr.gnd,lyr.dsd,lyr.dist,lyr.prov,lyr.proj]);
map.on('zoomend', function(){ scheduleResetLabels(); });
map.on('layeradd',    function(){ if(!_bulkMode) scheduleResetLabels(); });
map.on('layerremove', function(){ if(!_bulkMode) scheduleResetLabels(); });
